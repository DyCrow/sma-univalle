<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 615" font-family="Segoe UI,Roboto,sans-serif" role="img" aria-label="Topología de la red de agentes"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker></defs><rect width="1120" height="615" fill="#ffffff"/><text x="20" y="28" font-size="16" font-weight="700" fill="#0b3d38">Topología de la red de agentes · flujo de payloads</text><rect x="20" y="60" width="150" height="70" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.6"/><text x="95.0" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#7c3a06">Archivo de entrada</text><text x="95.0" y="98" text-anchor="middle" font-size="11" fill="#33413e">CSV · Excel · JSON</text><text x="95.0" y="113" text-anchor="middle" font-size="11" fill="#33413e">cualquier estructura</text><rect x="215" y="60" width="170" height="70" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="6 4"/><text x="300.0" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#0b3d38">Ingesta + Percepción</text><text x="300.0" y="98" text-anchor="middle" font-size="11" fill="#33413e">encoding · delimitador · encabezado</text><text x="300.0" y="113" text-anchor="middle" font-size="11" fill="#33413e">tipos · formatos · nulos</text><rect x="430" y="60" width="190" height="70" rx="10" fill="#e8f4f1" stroke="#0f766e" stroke-width="1.6"/><text x="525.0" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#0b3d38">AGENTE 1 · Auditor y Limpiador</text><text x="525.0" y="98" text-anchor="middle" font-size="11" fill="#33413e">valida/corrige esquema, normaliza</text><text x="525.0" y="113" text-anchor="middle" font-size="11" fill="#33413e">problemas + veredicto de calidad</text><rect x="665" y="60" width="170" height="70" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="6 4"/><text x="750.0" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#0b3d38">Cómputo estadístico</text><text x="750.0" y="98" text-anchor="middle" font-size="11" fill="#33413e">hechos exactos con ref:</text><text x="750.0" y="113" text-anchor="middle" font-size="11" fill="#33413e">resúmenes · series · correlaciones</text><rect x="880" y="60" width="220" height="70" rx="10" fill="#e8f4f1" stroke="#0f766e" stroke-width="1.6"/><text x="990.0" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#0b3d38">AGENTE 2 · Analista Estadístico</text><text x="990.0" y="98" text-anchor="middle" font-size="11" fill="#33413e">selecciona variables clave,</text><text x="990.0" y="113" text-anchor="middle" font-size="11" fill="#33413e">interacciones, tendencias, texto</text><line x1="170" y1="95" x2="215" y2="95" stroke="#0f766e" stroke-width="2" marker-end="url(#ar)"/><line x1="385" y1="95" x2="430" y2="95" stroke="#0f766e" stroke-width="2" marker-end="url(#ar)"/><line x1="620" y1="95" x2="665" y2="95" stroke="#0f766e" stroke-width="2" marker-end="url(#ar)"/><line x1="835" y1="95" x2="880" y2="95" stroke="#0f766e" stroke-width="2" marker-end="url(#ar)"/><rect x="880" y="200" width="220" height="70" rx="10" fill="#e8f4f1" stroke="#0f766e" stroke-width="1.6"/><text x="990.0" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#0b3d38">AGENTE 3 · Intérprete Contextual</text><text x="990.0" y="238" text-anchor="middle" font-size="11" fill="#33413e">infiere dominio, impacto,</text><text x="990.0" y="253" text-anchor="middle" font-size="11" fill="#33413e">riesgos, oportunidades, N/A</text><rect x="430" y="200" width="380" height="70" rx="10" fill="#e8f4f1" stroke="#0f766e" stroke-width="1.6"/><text x="620.0" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#0b3d38">AGENTE 4 · Generador de Informes</text><text x="620.0" y="238" text-anchor="middle" font-size="11" fill="#33413e">informe ejecutivo estructurado +</text><text x="620.0" y="253" text-anchor="middle" font-size="11" fill="#33413e">directivas de visualización (gráficos SVG)</text><rect x="20" y="200" width="360" height="70" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.6"/><text x="200.0" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#7c3a06">Entregable</text><text x="200.0" y="238" text-anchor="middle" font-size="11" fill="#33413e">Informe HTML/MD · gráficos · trazabilidad JSON · CSV limpio</text><line x1="990" y1="130" x2="990" y2="200" stroke="#0f766e" stroke-width="2" marker-end="url(#ar)"/><text x="990.0" y="159.0" text-anchor="middle" font-size="10" fill="#5b6b67">payload 2</text><line x1="880" y1="235" x2="810" y2="235" stroke="#0f766e" stroke-width="2" marker-end="url(#ar)"/><line x1="430" y1="235" x2="380" y2="235" stroke="#0f766e" stroke-width="2" marker-end="url(#ar)"/><rect x="420" y="296" width="690" height="46" rx="10" fill="#fff1f2" stroke="#be123c" stroke-width="1.4" stroke-dasharray="5 4"/><text x="765" y="316" text-anchor="middle" font-size="13" font-weight="700" fill="#9f1239">GUARDRAILS entre cada etapa</text><text x="765" y="333" text-anchor="middle" font-size="10" fill="#33413e">esquema JSON · reintento con error · valores medidos autoritativos · refs verificables · cifras enmascaradas · respaldo</text><text x="20" y="338" font-size="14" font-weight="700" fill="#0b3d38">PLUS · Agente 5</text><text x="20" y="354" font-size="11" fill="#5b6b67">(conversacional, sobre el informe ya generado)</text><rect x="20" y="392" width="230" height="100" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.6"/><text x="135.0" y="412" text-anchor="middle" font-size="13" font-weight="700" fill="#7c3a06">Administrador/a</text><text x="135.0" y="430" text-anchor="middle" font-size="11" fill="#33413e">rol · pregunta · decisión</text><text x="135.0" y="445" text-anchor="middle" font-size="11" fill="#33413e">historial de la conversación</text><rect x="330" y="392" width="250" height="100" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="6 4"/><text x="455.0" y="412" text-anchor="middle" font-size="13" font-weight="700" fill="#0b3d38">Señales verificables</text><text x="455.0" y="430" text-anchor="middle" font-size="11" fill="#33413e">entidades de los datos citadas</text><text x="455.0" y="445" text-anchor="middle" font-size="11" fill="#33413e">cifras vs variabilidad real</text><text x="455.0" y="460" text-anchor="middle" font-size="11" fill="#33413e">sesgos · lente por rol/dominio</text><rect x="660" y="392" width="440" height="100" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="1.6"/><text x="880.0" y="412" text-anchor="middle" font-size="13" font-weight="700" fill="#312e81">AGENTE 5 · Consejero Estratégico y Líder-Analista</text><text x="880.0" y="430" text-anchor="middle" font-size="11" fill="#33413e">cuestiona supuestos · evidencia a favor/en contra · pre-mortem</text><text x="880.0" y="445" text-anchor="middle" font-size="11" fill="#33413e">alternativas · postura con condiciones · plan de liderazgo</text><text x="880.0" y="460" text-anchor="middle" font-size="11" fill="#33413e">preguntas de vuelta · datos que faltan</text><line x1="250" y1="442" x2="330" y2="442" stroke="#0f766e" stroke-width="2" marker-end="url(#ar)"/><line x1="580" y1="442" x2="660" y2="442" stroke="#0f766e" stroke-width="2" marker-end="url(#ar)"/><rect x="660" y="508" width="440" height="90" rx="10" fill="#fdf4ff" stroke="#a21caf" stroke-width="1.6"/><text x="880.0" y="528" text-anchor="middle" font-size="13" font-weight="700" fill="#701a75">AGENTE 6 · Simulador de Crisis y Evaluación Directiva</text><text x="880.0" y="546" text-anchor="middle" font-size="11" fill="#33413e">rol (Auxiliar · Asistente · Supervisor · Gerente) + tipo de crisis</text><text x="880.0" y="561" text-anchor="middle" font-size="11" fill="#33413e">preguntas: opción múltiple · V/F · emparejamiento · completar</text><text x="880.0" y="576" text-anchor="middle" font-size="11" fill="#33413e">reporte final: puntaje, % de éxito, diagnóstico por rol</text><path d="M135,492 L135,553 L660,553" fill="none" stroke="#a21caf" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#ar)"/><text x="400" y="546" text-anchor="middle" font-size="10" fill="#a21caf">elige rol y dinámica → responde → recibe evaluación</text><path d="M880,392 C880,352 135,352 135,392" fill="none" stroke="#4338ca" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#ar)"/><text x="700" y="380" text-anchor="middle" font-size="10" fill="#4338ca">memorando de decisión vuelve al administrador (diálogo)</text></svg>